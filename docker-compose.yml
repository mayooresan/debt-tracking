version: '3.8'

services:
  debt-planner:
    build:
      context: .
      dockerfile: Dockerfile
    image: debt-planner:latest
    container_name: debt-planner
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/budget.db
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - BASE_CURRENCY=${BASE_CURRENCY:-USD}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.debt-planner.rule=Host(`debt.jaymayu.com`)"
      - "traefik.http.routers.debt-planner.entrypoints=websecure"
      - "traefik.http.routers.debt-planner.tls.certresolver=letsencrypt"
      - "traefik.http.services.debt-planner.loadbalancer.server.port=3000"
    networks:
      - web

networks:
  web:
    external: true
